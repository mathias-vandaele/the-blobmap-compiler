[package]
name = "blobmap-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
blobmap-model.workspace = true
bytemuck.workspace = true
hex.workspace = true
rayon.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The GPU backend: CubeCL on its CUDA runtime (driver and NVRTC loaded at run time, so no
# CUDA toolkit is needed to build) and on its wgpu runtime (Vulkan, Metal, DX12).
cubecl = { version = "=0.11.4", default-features = false, features = ["std", "cuda", "wgpu"] }
cubecl-runtime = "=0.11.4"

