"by:urban" = 60.0
"by:motorway" = 110.0
"ca-on:rural" = 80.0
"ch:rural" = 80.0
"ch:trunk" = 100.0
"ch:motorway" = 120.0
"cz:trunk" = 0.0
"cz:motorway" = 0.0
"de:living_street" = 7.0
"de:rural" = 100.0
"de:motorway" = 0.0
"dk:rural" = 80.0
"es:trunk" = 90.0
"fr:rural" = 80.0
"gb:nsl_single" = 96.54
"gb:nsl_dual" = 112.63
"gb:motorway" = 112.63
"nl:rural" = 80.0
"nl:trunk" = 100.0
"no:rural" = 80.0
"no:motorway" = 110.0
"ph:urban" = 40.0
"ph:rural" = 80.0
"ph:motorway" = 100.0
"pl:rural" = 100.0
"pl:expressway" = 120.0
"pl:motorway" = 140.0
"ro:trunk" = 100.0
"ru:living_street" = 20.0
"ru:urban" = 60.0
"ru:motorway" = 110.0
"uk:nsl_single" = 96.54
"uk:nsl_dual" = 112.63
"uk:motorway" = 112.63
"za:urban" = 60.0
"za:rural" = 100.0
"none" = 140.0

# Speed caps by surface / tracktype / smoothness (km/h); 0 closes the direction.
[speeds.caps.surface]
cement = 80.0
compacted = 80.0
fine_gravel = 80.0
paving_stones = 60.0
metal = 60.0
bricks = 60.0
grass = 40.0
wood = 40.0
sett = 40.0
grass_paver = 40.0
gravel = 40.0
unpaved = 40.0
ground = 40.0
dirt = 40.0
pebblestone = 40.0
tartan = 40.0
cobblestone = 30.0
clay = 30.0
earth = 20.0
stone = 20.0
rocky = 20.0
sand = 20.0
mud = 10.0

[speeds.caps.tracktype]
grade1 = 60.0
grade2 = 40.0
grade3 = 30.0
grade4 = 25.0
grade5 = 20.0

[speeds.caps.smoothness]
intermediate = 80.0
bad = 40.0
very_bad = 20.0
horrible = 10.0
very_horrible = 5.0
impassable = 0.0

[ways]
# A way with any of these tags is not a car road.
exclude = [["area", "yes"], ["service", "emergency_access"], ["impassable", "yes"]]
# One-way without an oneway tag.
implied_oneway_highways = ["motorway"]
implied_oneway_junctions = ["roundabout", "circular"]
# oneway values; reversible / alternating ways are dropped.
oneway_forward = ["yes", "1", "true"]
oneway_backward = ["-1"]
oneway_none = ["no", "0", "false"]
oneway_drop = ["reversible", "alternating"]

[access]
# Most specific first: motorcar, motor_vehicle, vehicle, access.
keys = ["motorcar", "motor_vehicle", "vehicle", "access"]
blacklist = ["no", "agricultural", "forestry", "emergency", "psv", "customers", "private", "delivery"]

# OSRM lib/obstacles.lua delays, charged to the arcs entering the node (per direction
# when the node is tagged with one).
[obstacles]
traffic_signals_s = 2.0
stop_s = 2.0
stop_minor_s = 2.0
give_way_s = 1.0

# car.lua process_turn: sigmoid of the turn angle, at junctions of more than two roads
# and at u-turns.
[turns]
turn_penalty_s = 7.5
turn_bias = 1.075
u_turn_penalty_s = 20.0

# Snapping (SPEC §6): the radius, and the pieces no ID may stand on. A piece is ineligible
# if its highway is listed, or if it carries one of `exclude_keys` with a value other than
# those in `keep_values`.
[snap]
radius_m = 2000
# Mirrors OSRM's small_component_size, at its default of 1000: an ID is never snapped to a
# component of at most this many nodes (of the family graph) when a larger component has a
# servable piece within the radius. Otherwise the nearest servable piece wins.
small_component_max_nodes = 1000
exclude_highways = ["motorway", "motorway_link", "trunk", "trunk_link"]
exclude_keys = ["bridge", "tunnel", "covered"]
keep_values = ["no"]

