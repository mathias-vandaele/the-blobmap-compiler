# CAR profile (SPEC §4): OSRM v6.0.0 car.lua (speeds, access, one-way, obstacles) and its
# process_turn (turn costs), plus the snapping rules of SPEC §6. The evaluation order of the
# rules is code (crate `profile`); its numbers and tag lists are here. The file's sha256 goes
# into the manifest and into inputs_hash.

[profile]
name = "car"
version = 1
family = "car"
reference = "OSRM v6.0.0 car.lua"

[speeds]
# maxspeed (and :forward/:backward) scaled by this factor, as car.lua does.
maxspeed_factor = 0.8
# Keys looked up for maxspeed, first match wins, each with :forward / :backward variants.
maxspeed_keys = ["maxspeed:advisory", "maxspeed", "source:maxspeed", "maxspeed:type"]
# bridge=movable (unless capacity:car=0).
movable_bridge_kmh = 5.0

# Default speed by highway class (km/h); a class not listed is not a car road.
[speeds.highway]
motorway = 90.0
motorway_link = 45.0
trunk = 85.0
trunk_link = 40.0
primary = 65.0
primary_link = 30.0
secondary = 55.0
secondary_link = 25.0
tertiary = 40.0
tertiary_link = 20.0
unclassified = 25.0
residential = 25.0
living_street = 10.0
service = 15.0

# "xx:<class>" maxspeed values not in the table below (string.match "%a%a:(%a+)").
[speeds.zone_defaults]
urban = 50.0
rural = 90.0
trunk = 110.0
motorway = 130.0

# car.lua maxspeed_table (lower-case keys). The gb/uk values are mph × 1609 / 1000,
# computed in f32 (the crate checks that these decimals give the same f32).
[speeds.maxspeed_table]
"at:rural" = 100.0
"at:trunk" = 100.0
"be:motorway" = 120.0
"be-bru:rural" = 70.0
"be-bru:urban" = 30.0
